<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor M3U</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e2e5ea; --accent:#2563eb; --sel:#e8f0fe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --panel:#1d2128; --text:#e6e8eb; --muted:#9aa3ae; --line:#2c323b; --accent:#5b8def; --sel:#22324d; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  button, input, select { font:inherit; color:inherit; }
  button { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=text], input[type=url], select { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  main { display:grid; grid-template-columns:260px 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; min-width:0; }
  .panel h2 { font-size:13px; text-transform:uppercase; color:var(--muted); margin:4px 0 8px; }
  .src { display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid var(--line); }
  .src span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; align-items:center; }
  .toolbar input[type=text] { flex:1; min-width:160px; }
  .group { border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  .ghead { display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--bg); cursor:pointer; user-select:none; }
  .ghead b { flex:1; }
  .item { display:grid; grid-template-columns:20px 28px 1fr 1fr auto; gap:8px; align-items:center; padding:4px 8px; border-top:1px solid var(--line); }
  .item.on { background:var(--sel); }
  .item img { width:28px; height:28px; object-fit:contain; }
  .item input[type=text] { width:100%; padding:3px 6px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; background:var(--bg); color:var(--muted); white-space:nowrap; }
  .url { grid-column:3 / -1; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dup { outline:1px dashed #d97706; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:16px; text-align:center; color:var(--muted); margin-top:8px; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Editor M3U</h1>
  <label><button onclick="fileIn.click()">📂 Abrir arquivos .m3u</button>
    <input id="fileIn" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,text/plain" multiple hidden></label>
  <input id="urlIn" type="url" placeholder="ou cole a URL de uma lista" style="min-width:260px">
  <button onclick="loadUrl()">Carregar URL</button>
  <span style="flex:1"></span>
  <span id="count" class="muted"></span>
  <button class="primary" onclick="exportM3U()">⬇ Exportar lista unificada</button>
</header>

<main>
  <aside class="panel">
    <h2>Listas carregadas</h2>
    <div id="sources"><p class="muted">Nenhuma lista ainda.</p></div>
    <div id="drop">Arraste arquivos .m3u para cá</div>
    <h2 style="margin-top:16px">Opções de exportação</h2>
    <label><input type="checkbox" id="dedupe" checked> Remover URLs duplicadas</label><br>
    <label><input type="checkbox" id="sortGroups"> Ordenar grupos A–Z</label><br>
    <label class="muted">Nome do arquivo<br><input type="text" id="outName" value="lista-unificada.m3u" style="width:100%"></label>
  </aside>

  <section class="panel">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Buscar canal, grupo ou URL…">
      <select id="groupBy">
        <option value="group">Agrupar por grupo (group-title)</option>
        <option value="source">Agrupar por lista de origem</option>
        <option value="none">Sem agrupamento</option>
      </select>
      <label><input type="checkbox" id="onlySel"> Só selecionados</label>
    </div>
    <div class="toolbar">
      <button onclick="setVisible(true)">Selecionar visíveis</button>
      <button onclick="setVisible(false)">Desmarcar visíveis</button>
      <input type="text" id="moveTo" placeholder="Novo grupo para os selecionados" style="flex:0 1 240px">
      <button onclick="moveSelected()">Mover selecionados</button>
      <button onclick="expandAll(true)">Expandir tudo</button>
      <button onclick="expandAll(false)">Recolher tudo</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
// Estado: cada canal guarda os atributos do #EXTINF e as linhas extras (#EXTVLCOPT, #KODIPROP...)
let sources = [];   // {id, name, epg, enabled}
let items = [];     // {id, src, name, group, attrs:{}, duration, extra:[], url, sel}
let nextId = 1;
const collapsed = new Set();
const $ = id => document.getElementById(id);

function parseAttrs(s) {
  const attrs = {};
  const re = /([\w-]+)="([^"]*)"/g;
  let m;
  while ((m = re.exec(s))) attrs[m[1]] = m[2];
  return attrs;
}

function parseM3U(text, srcName) {
  const src = { id: nextId++, name: srcName, epg: '', enabled: true };
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  let cur = null, extra = [];
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTM3U')) {
      const a = parseAttrs(line);
      src.epg = a['url-tvg'] || a['x-tvg-url'] || '';
    } else if (line.startsWith('#EXTINF')) {
      const body = line.slice(line.indexOf(':') + 1);
      // A vírgula que separa o nome fica depois do último atributo entre aspas
      const lastQuote = body.lastIndexOf('"');
      const comma = body.indexOf(',', lastQuote + 1);
      const head = comma >= 0 ? body.slice(0, comma) : body;
      const attrs = parseAttrs(head);
      cur = {
        duration: (head.match(/^\s*(-?\d+)/) || [, '-1'])[1],
        attrs,
        name: (comma >= 0 ? body.slice(comma + 1) : '').trim() || attrs['tvg-name'] || 'Sem nome',
        group: attrs['group-title'] || '',
      };
    } else if (line.startsWith('#EXTGRP:')) {
      if (cur && !cur.group) cur.group = line.slice(8).trim();
    } else if (line.startsWith('#')) {
      extra.push(line);
    } else {
      const it = cur || { duration: '-1', attrs: {}, name: line, group: '' };
      items.push({ id: nextId++, src: src.id, ...it, group: it.group || 'Sem grupo', extra, url: line, sel: false });
      cur = null; extra = [];
    }
  }
  sources.push(src);
  render();
}

async function loadFiles(files) {
  for (const f of [...files]) parseM3U(await f.text(), f.name);
}

async function loadUrl() {
  const url = $('urlIn').value.trim();
  if (!url) return;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    parseM3U(await r.text(), url.split('/').pop() || url);
    $('urlIn').value = '';
  } catch (e) {
    alert('Não foi possível baixar a lista (' + e.message + ').\nO servidor pode bloquear acesso pelo navegador (CORS). Baixe o arquivo e abra-o pelo botão "Abrir arquivos".');
  }
}

function removeSource(id) {
  sources = sources.filter(s => s.id !== id);
  items = items.filter(i => i.src !== id);
  render();
}

function visibleItems() {
  const q = $('search').value.toLowerCase();
  const onlySel = $('onlySel').checked;
  const enabled = new Set(sources.filter(s => s.enabled).map(s => s.id));
  return items.filter(i => enabled.has(i.src) && (!onlySel || i.sel) &&
    (!q || i.name.toLowerCase().includes(q) || i.group.toLowerCase().includes(q) || i.url.toLowerCase().includes(q)));
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  // Fontes
  $('sources').innerHTML = sources.length ? sources.map(s => {
    const n = items.filter(i => i.src === s.id).length;
    const k = items.filter(i => i.src === s.id && i.sel).length;
    return `<div class="src"><input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleSource(${s.id}, this.checked)" title="Mostrar/ocultar">
      <span title="${esc(s.name)}">${esc(s.name)}<br><span class="muted">${k} de ${n} selecionados</span></span>
      <button onclick="removeSource(${s.id})" title="Remover lista">✕</button></div>`;
  }).join('') : '<p class="muted">Nenhuma lista ainda.</p>';

  // Contagem de URLs para marcar duplicados
  const urlCount = {};
  for (const i of items) urlCount[i.url] = (urlCount[i.url] || 0) + 1;
  const srcName = Object.fromEntries(sources.map(s => [s.id, s.name]));

  const vis = visibleItems();
  const mode = $('groupBy').value;
  const groups = new Map();
  for (const i of vis) {
    const key = mode === 'group' ? i.group : mode === 'source' ? srcName[i.src] : 'Todos os canais';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }

  const html = [];
  for (const [g, list] of groups) {
    const nsel = list.filter(i => i.sel).length;
    const open = !collapsed.has(mode + g);
    const gk = esc(JSON.stringify(g));
    html.push(`<div class="group"><div class="ghead" onclick="toggleGroup(${gk})">
      <input type="checkbox" ${nsel === list.length ? 'checked' : ''} onclick="event.stopPropagation(); selectGroup(${gk}, this.checked)">
      <b>${open ? '▾' : '▸'} ${esc(g)}</b><span class="muted">${nsel}/${list.length}</span></div>`);
    if (open) for (const i of list.slice(0, 500)) {
      html.push(`<div class="item ${i.sel ? 'on' : ''} ${urlCount[i.url] > 1 ? 'dup' : ''}">
        <input type="checkbox" ${i.sel ? 'checked' : ''} onchange="selectItem(${i.id}, this.checked)">
        ${i.attrs['tvg-logo'] ? `<img src="${esc(i.attrs['tvg-logo'])}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : '<span></span>'}
        <input type="text" value="${esc(i.name)}" onchange="editItem(${i.id}, 'name', this.value)" title="Nome">
        <input type="text" value="${esc(i.group)}" onchange="editItem(${i.id}, 'group', this.value)" title="Grupo">
        <span class="tag" title="Lista de origem">${esc(srcName[i.src])}</span>
        <div class="url" title="${esc(i.url)}">${urlCount[i.url] > 1 ? '⚠ duplicado · ' : ''}${esc(i.url)}</div></div>`);
    }
    if (open && list.length > 500) html.push(`<p class="muted" style="padding:6px 8px">… mais ${list.length - 500} canais (use a busca para filtrar; "Selecionar grupo" afeta todos)</p>`);
    html.push('</div>');
  }
  $('list').innerHTML = html.join('') || '<p class="muted">Carregue uma ou mais listas M3U para começar.</p>';
  $('count').textContent = `${items.filter(i => i.sel).length} selecionados de ${items.length}`;
}

function groupKeyOf(i) {
  const mode = $('groupBy').value;
  return mode === 'group' ? i.group : mode === 'source' ? sources.find(s => s.id === i.src).name : 'Todos os canais';
}
function toggleGroup(g) { const k = $('groupBy').value + g; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); render(); }
function selectGroup(g, on) { visibleItems().filter(i => groupKeyOf(i) === g).forEach(i => i.sel = on); render(); }
function selectItem(id, on) { items.find(i => i.id === id).sel = on; render(); }
function editItem(id, field, v) { items.find(i => i.id === id)[field] = v.trim() || (field === 'group' ? 'Sem grupo' : v); render(); }
function toggleSource(id, on) { sources.find(s => s.id === id).enabled = on; render(); }
function setVisible(on) { visibleItems().forEach(i => i.sel = on); render(); }
function expandAll(open) {
  const mode = $('groupBy').value;
  for (const i of visibleItems()) { const k = mode + groupKeyOf(i); open ? collapsed.delete(k) : collapsed.add(k); }
  render();
}
function moveSelected() {
  const g = $('moveTo').value.trim();
  if (!g) return alert('Digite o nome do grupo de destino.');
  items.filter(i => i.sel).forEach(i => i.group = g);
  render();
}

function exportM3U() {
  let out = items.filter(i => i.sel);
  if (!out.length) return alert('Selecione ao menos um canal.');
  if ($('dedupe').checked) {
    const seen = new Set();
    out = out.filter(i => !seen.has(i.url) && seen.add(i.url));
  }
  if ($('sortGroups').checked) out = [...out].sort((a, b) => a.group.localeCompare(b.group, 'pt-BR'));
  else {
    // Mantém os canais de um mesmo grupo juntos, na ordem em que os grupos aparecem
    const order = new Map();
    out.forEach(i => order.has(i.group) || order.set(i.group, order.size));
    out = [...out].sort((a, b) => order.get(a.group) - order.get(b.group));
  }
  const epgs = [...new Set(sources.filter(s => out.some(i => i.src === s.id)).map(s => s.epg).filter(Boolean))];
  const lines = [epgs.length ? `#EXTM3U url-tvg="${epgs.join(',')}"` : '#EXTM3U'];
  for (const i of out) {
    const attrs = { ...i.attrs, 'group-title': i.group };
    if (!attrs['tvg-name']) attrs['tvg-name'] = i.name;
    const a = Object.entries(attrs).map(([k, v]) => `${k}="${v.replace(/"/g, "'")}"`).join(' ');
    lines.push(`#EXTINF:${i.duration} ${a},${i.name}`, ...i.extra, i.url);
  }
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'audio/x-mpegurl' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = $('outName').value.trim() || 'lista-unificada.m3u';
  link.click();
  URL.revokeObjectURL(link.href);
}

$('fileIn').onchange = e => { loadFiles(e.target.files); e.target.value = ''; };
['search', 'groupBy', 'onlySel'].forEach(id => $(id).addEventListener('input', render));
const drop = $('drop');
document.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
document.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); loadFiles(e.dataTransfer.files); });
render();
</script>
</body>
</html>

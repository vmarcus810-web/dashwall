    <rect x="230" y="344" width="58" height="90" rx="14" />
    <rect x="318" y="274" width="58" height="160" rx="14" />
    <rect x="406" y="314" width="58" height="120" rx="14" />
    <rect x="494" y="224" width="58" height="210" rx="14" />
    <rect x="582" y="284" width="58" height="150" rx="14" />
    <rect x="670" y="194" width="58" height="240" rx="14" />
